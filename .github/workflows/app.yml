name: Publicar app

on:
  push:
    branches: [main]
    paths: ["app/**", "alertas/bolsa.py", "bolsa.json", ".github/workflows/app.yml"]
  schedule:
    # Bolsa cada 30 min en horario de EE. UU. (hora UTC), lunes a viernes: cabe en el plan gratis de Twelve Data
    - cron: "*/30 13-21 * * 1-5"
    # Cada 6 horas el resto del tiempo
    - cron: "7 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pruebas del motor de análisis
        run: node --test tests/analysis.test.js
      - name: Restaurar estado de avisos de bolsa
        uses: actions/cache/restore@v4
        with:
          path: estado_bolsa.json
          key: bolsa-${{ github.run_id }}
          restore-keys: bolsa-
      - name: Descargar datos de bolsa
        continue-on-error: true   # si falla, la app se publica igual (la pestaña Bolsa avisa)
        timeout-minutes: 6
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m alertas.bolsa --lista bolsa.json --salida app/data
      - name: Guardar estado de avisos de bolsa
        if: always()
        uses: actions/cache/save@v4
        with:
          path: estado_bolsa.json
          key: bolsa-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      # GitHub a veces no encuentra el artefacto recién subido: esperar y reintentar
      - name: Esperar a que el artefacto esté disponible
        run: sleep 10
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Reintentar publicación
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
