name: Diagnóstico app
on:
  push:
    branches: [claude/diagnostico]
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Probar APIs directamente (con cabecera Origin como un navegador)
        run: |
          for u in "https://api.dexscreener.com/token-profiles/latest/v1" "https://api.dexscreener.com/tokens/v1/solana/So11111111111111111111111111111111111111112" "https://api.geckoterminal.com/api/v2/networks/solana/trending_pools?page=1" "https://api.coingecko.com/api/v3/ping" "https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"; do
            echo "== $u"; curl -s -o /dev/null -D - -H "Origin: https://tomytpo.github.io" "$u" | grep -iE "^HTTP|access-control-allow-origin|retry-after|x-ratelimit" || echo "sin respuesta"
          done
      - name: Abrir la app publicada en un navegador real
        run: |
          npm i --no-save playwright@1.49.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node diag/diag.js
